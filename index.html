<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zoë Anne Kessler — Paintings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1F3FAE}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:#fff;font-family:Arial,Helvetica,sans-serif}
main{position:relative;height:100%;display:grid;grid-template-columns:1fr}
main img{width:100%;height:100%;object-fit:cover;object-position:40% 50%;display:block;min-width:0}
main::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,22,90,.45),rgba(10,22,90,0) 55%);pointer-events:none}
.text{position:absolute;z-index:1;left:clamp(1.5rem,5vw,4.5rem);right:clamp(1.5rem,5vw,4.5rem);top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;text-shadow:0 2px 24px rgba(10,22,90,.35)}
h1{margin:0;font-family:"Arial Black","Arial-BoldMT",Gadget,"Archivo Black",sans-serif;font-weight:900;text-transform:uppercase;font-size:clamp(2.6rem,7.5vw,7rem);line-height:.98;letter-spacing:-.02em}
h1 span{display:block}
.sub{margin:clamp(1.5rem,3vw,2.5rem) 0 0;font-weight:300;text-transform:uppercase;letter-spacing:.5em;font-size:clamp(.8rem,1.4vw,1.25rem);line-height:2.2}
footer{position:absolute;z-index:1;left:clamp(1.5rem,5vw,4.5rem);right:clamp(1.5rem,5vw,4.5rem);bottom:calc(clamp(1.25rem,3vw,2.5rem) + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;text-shadow:0 2px 16px rgba(10,22,90,.55)}
.mail{color:#fff;font-weight:500;text-transform:uppercase;letter-spacing:.14em;font-size:clamp(.72rem,1vw,.9rem);text-decoration:none;border-bottom:2px solid #E6B72B;padding-bottom:.3rem}
.mail:hover{border-bottom-color:#fff}
.copy{margin:1rem 0 0;font-size:clamp(.65rem,.85vw,.78rem);letter-spacing:.12em;text-transform:uppercase;font-weight:400;opacity:.9}
.quote{margin:0;text-align:right;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:clamp(.9rem,1.25vw,1.45rem);line-height:1.5}
.quote .l{display:block;white-space:nowrap}
.quote cite{display:block;margin-top:.5rem;font-style:normal;font-size:.85em;opacity:.9}
main::before{content:"";position:absolute;inset:auto 0 0 0;height:34%;background:linear-gradient(0deg,rgba(10,22,90,.5),rgba(10,22,90,0));z-index:0;pointer-events:none}
:focus-visible{outline:3px solid #E6B72B;outline-offset:4px}
@media (max-width:640px){.sub{letter-spacing:.3em}.text{justify-content:flex-end;padding-bottom:14rem}footer{flex-direction:column-reverse;align-items:flex-start;gap:1.25rem}.quote{text-align:left;max-width:34ch}.quote .l{display:inline;white-space:normal}}
</style>
</head>
